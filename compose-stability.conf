// Types from :shared that the Compose compiler should treat as stable.
//
// They cannot say so themselves. @Immutable comes from androidx.compose.runtime, and :shared holds
// no Compose dependency on purpose — it is the sync format, the decoders and the analysis, and a UI
// library has no business in it. Without this file the compiler has nothing to go on for a class
// from a module it did not compile, treats every song as unstable, and recomposes a list of four
// thousand of them more than it needs to. The property was there before the merge: the model
// carried @Immutable while it lived inside each app.
//
// Read by :app and by :desktop, which is the point of its being here rather than twice.
music.ai.recommend.model.*
music.ai.recommend.ai.*
