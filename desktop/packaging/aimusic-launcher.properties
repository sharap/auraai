# A second launcher, so the application can be started by typing its name as well as by clicking
# its icon. jpackage names the first launcher after the application itself — AiMusic, capitals and
# all, because that same name is the label under the icon in the menu — and a command is better
# lowercase, like the package, the installed directory and ~/.aimusic.
#
# It is the same application, not a second configuration: jpackage copies the main launcher's
# class path and java options into this one, the MPRIS DesktopEntry property among them.
#
# linux-shortcut=false is what keeps the menu from showing the application twice. Every launcher
# gets its own .desktop file otherwise, and the post-install script registers both.
description=AiMusic, started from a terminal
linux-shortcut=false
